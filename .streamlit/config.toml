[theme]
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["36px", "25px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
linkUnderline = false
baseRadius = "12px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = [
    "#2563EB",
    "#0D9488",
    "#7C3AED",
    "#EA580C",
    "#DB2777",
    "#0891B2",
    "#65A30D",
    "#9333EA",
]

[theme.light]
primaryColor = "#1D4ED8"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#0F172A"
linkColor = "#1D4ED8"
borderColor = "#D7E0EA"
dataframeBorderColor = "#D7E0EA"
dataframeHeaderBackgroundColor = "#EEF2F7"
greenColor = "#047857"
redColor = "#B91C1C"
yellowColor = "#A16207"
orangeColor = "#C2410C"
blueColor = "#1D4ED8"
violetColor = "#6D28D9"
grayColor = "#64748B"

[theme.dark]
primaryColor = "#60A5FA"
backgroundColor = "#08111F"
secondaryBackgroundColor = "#111C2E"
textColor = "#E8EEF7"
linkColor = "#7DB7FF"
borderColor = "#26364D"
dataframeBorderColor = "#26364D"
dataframeHeaderBackgroundColor = "#111C2E"
greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"

[theme.light.sidebar]
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#E2E8F0"
textColor = "#0F172A"
borderColor = "#D7E0EA"
primaryColor = "#1D4ED8"

[theme.dark.sidebar]
backgroundColor = "#0B1423"
secondaryBackgroundColor = "#172236"
textColor = "#E8EEF7"
borderColor = "#26364D"
primaryColor = "#60A5FA"
